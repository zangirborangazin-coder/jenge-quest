<!doctype html>
<html lang="kk-KZ" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Language" content="kk-KZ">
  <meta name="google" content="notranslate">
  <meta name="theme-color" content="#d7b0c1">
  <title>Туған күнге арналған квест</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #46343f;
      --muted: #74616d;
      --gold: #9a657b;
      --rose: #b77f96;
      --panel: rgba(255, 252, 249, .97);
      --line: rgba(106, 78, 94, .20);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 50% 44%, rgba(255, 252, 248, .30), transparent 34%),
        linear-gradient(135deg, #d8c1c8 0%, #cbb1bd 52%, #d6c2c7 100%);
      background-size: 100% 100%, 220% 220%;
      overflow-x: hidden;
      animation: background-flow 8s ease-in-out infinite alternate;
    }

    body::before {
      position: fixed;
      z-index: 0;
      inset: -20%;
      background:
        radial-gradient(ellipse at 18% 35%, rgba(255, 248, 251, .38), transparent 20%),
        radial-gradient(ellipse at 82% 68%, rgba(155, 87, 119, .18), transparent 22%);
      content: "";
      pointer-events: none;
      animation: soft-light-flow 9s ease-in-out infinite alternate;
    }

    @keyframes background-flow {
      0% { background-position: 50% 50%, 0% 50%; }
      50% { background-position: 50% 50%, 100% 50%; }
      100% { background-position: 50% 50%, 0% 50%; }
    }

    @keyframes soft-light-flow {
      0% { transform: translate3d(-8%, -5%, 0) scale(.96) rotate(-2deg); }
      100% { transform: translate3d(8%, 5%, 0) scale(1.12) rotate(3deg); }
    }

    .heart-decorations {
      position: fixed;
      z-index: 2;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .heart-decoration {
      position: absolute;
      color: rgba(255, 255, 255, .24);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1;
      text-align: center;
      text-shadow: 0 1px 5px rgba(255, 255, 255, .12);
      transform: rotate(var(--heart-rotation, 0deg));
      transition: left 1.2s ease-in-out, top 1.2s ease-in-out, opacity .45s ease;
      animation: heart-pulse var(--pulse-speed, 2.4s) ease-in-out var(--pulse-delay, 0s) infinite;
    }

    .floating-photos {
      position: fixed;
      z-index: 4;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .floating-photo {
      position: absolute;
      width: clamp(112px, 8vw, 240px);
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border: 4px solid rgba(255, 246, 250, .88);
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(69, 35, 57, .24);
      opacity: .88;
      cursor: zoom-in;
      pointer-events: auto;
      will-change: transform;
      transition: none;
    }

    .floating-photo:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    .music-toggle {
      position: fixed;
      z-index: 21;
      right: 16px;
      bottom: 16px;
      min-height: 44px;
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(248,232,240,.96);
      box-shadow: 0 8px 24px rgba(69,35,57,.2);
      cursor: pointer;
      font: 600 .82rem Arial, sans-serif;
    }

    .music-toggle:hover { background: #f7dce8; }
    .music-toggle:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .page {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 38px 20px;
    }

    .shell { position: relative; z-index: 6; width: min(100%, 850px); }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--gold);
      font: 600 .82rem/1.4 Arial, sans-serif;
      letter-spacing: .24em;
      text-align: center;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }
    h1, h2 { font-weight: 400; }
    h1 { margin-bottom: 14px; font-size: clamp(3.2rem, 8vw, 5.8rem); line-height: 1.03; }
    h2 { margin-bottom: 14px; font-size: clamp(2.5rem, 5.5vw, 4rem); line-height: 1.1; }

    .card {
      position: relative;
      overflow: hidden;
      padding: clamp(25px, 6vw, 58px);
      border: 1px solid rgba(157, 86, 120, .34);
      border-radius: 28px;
      background: linear-gradient(145deg, #fffefe 0%, #fffafd 100%);
      box-shadow: 0 28px 90px rgba(69, 35, 57, .22), inset 0 1px rgba(255,255,255,.72);
      backdrop-filter: blur(18px);
      animation: arrive .55s ease both;
    }

    .card::before {
      position: absolute;
      top: 0;
      left: 12%;
      width: 76%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(223, 157, 181, .82), transparent);
      content: "";
    }

    .intro, .final { text-align: center; }
    .intro-copy, .question, .final-copy {
      max-width: 650px;
      margin: 0 auto 26px;
      color: var(--muted);
      font: 1.25rem/1.7 Arial, sans-serif;
    }

    .wifi {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      max-width: 400px;
      margin: 30px auto 14px;
      text-align: center;
    }

    .wifi-item {
      padding: 15px 17px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #fff9fc;
    }

    .wifi-label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font: .78rem Arial, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .wifi-value { color: #5f3b53; font: 600 1.12rem/1.35 Arial, sans-serif; overflow-wrap: anywhere; }
    .wifi-hint { margin: 0 0 28px; color: var(--gold); font: 1.02rem/1.5 Arial, sans-serif; }
    .wifi-form { display: grid; max-width: 400px; gap: 12px; margin: 0 auto; }
    .welcome { margin: 22px 0 0; color: var(--gold); font-size: 1.2rem; line-height: 1.6; }

    .progress-wrap { margin-bottom: 30px; }
    .progress-heading {
      position: relative;
      display: flex;
      min-height: 36px;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font: .9rem Arial, sans-serif;
      letter-spacing: .06em;
    }

    .progress-kind {
      position: absolute;
      left: 0;
      color: var(--gold);
      font-weight: 700;
      white-space: nowrap;
    }

    .heart-progress { position: relative; display: grid; width: min(72%, 420px); grid-template-columns: repeat(var(--heart-count), minmax(0, 1fr)); align-items: center; margin: 0 auto; }
    .heart-progress::before { position: absolute; top: 50%; right: 12%; left: 12%; height: 2px; background: rgba(114,65,91,.2); content: ""; transform: translateY(-50%); }
    .heart-progress::after { position: absolute; top: 50%; left: 12%; width: var(--progress-width, 0); height: 2px; background: linear-gradient(90deg, #bd4d79, #c97696); content: ""; transform: translateY(-50%); animation: fill-progress .65s cubic-bezier(.2,.8,.2,1) both; }
    .progress-heart { position: relative; z-index: 1; color: #bda8b2; font-size: 1.45rem; line-height: 1; text-align: center; transition: color .35s ease, transform .35s ease; }
    .progress-heart.is-filled { color: #bd4d79; transform: scale(1.08); }
    .progress-heart.is-current { animation: heart-beat .9s ease-in-out infinite alternate; }

    .question { margin: 0 0 23px; color: #755c70; }

    .memory-layout {
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(240px, 1.1fr);
      align-items: center;
      gap: clamp(22px, 5vw, 42px);
    }

    .memory-photo {
      position: relative;
      min-height: 340px;
      overflow: hidden;
      border: 1px solid rgba(157, 86, 120, .48);
      border-radius: 20px;
      background: #eedbe4;
      box-shadow: 0 18px 38px rgba(69,35,57,.22);
    }

    .memory-photo::after {
      position: absolute;
      inset: 45% 0 0;
      background: linear-gradient(transparent, rgba(17, 12, 19, .45));
      content: "";
      pointer-events: none;
    }

    .memory-photo img {
      position: absolute;
      width: 100%;
      height: 100%;
      inset: 0;
      object-fit: cover;
      filter: blur(7px);
      transform: scale(1.055);
      transition: filter .65s ease, transform .7s cubic-bezier(.2,.7,.2,1);
    }

    .memory-photo.is-revealed img { filter: blur(0); transform: scale(1); }
    .memory-photo.is-revealed:hover img { transform: scale(1.035); }
    .memory-photo[data-memory="meeting"] img { object-position: center 57%; }
    .memory-photo[data-memory="proposal"] img { object-position: center 58%; }
    .memory-photo[data-memory="wedding"] img { object-position: center 42%; }

    .photo-caption {
      position: absolute;
      z-index: 1;
      right: 16px;
      bottom: 15px;
      left: 16px;
      color: rgba(255,248,241,.92);
      font: .73rem Arial, sans-serif;
      letter-spacing: .12em;
      text-shadow: 0 2px 8px #000;
      text-transform: uppercase;
    }

    .quiz-title { margin: 0 0 22px; color: var(--ink); font-size: clamp(2.15rem, 5.5vw, 3.25rem); text-align: center; }
    .mini-game { text-align: center; }
    .mini-game-copy { max-width: 650px; margin: 0 auto 15px; color: var(--muted); font: 1.16rem/1.6 Arial, sans-serif; }
    .game-feedback { position: absolute; z-index: 3; width: min(48%, 360px); margin: 0; padding: 10px 14px; border: 1px solid rgba(157,86,120,.32); border-radius: 14px; color: var(--gold); background: rgba(248,232,240,.97); box-shadow: 0 8px 22px rgba(69,35,57,.16); font: 600 .95rem/1.5 Arial, sans-serif; text-align: center; pointer-events: none; }
    .dodge-arena { position: relative; min-height: 330px; overflow: hidden; margin: 18px 0 12px; border: 1px dashed rgba(157,86,120,.48); border-radius: 20px; background: radial-gradient(ellipse at center, rgba(247,223,234,.9), rgba(232,207,220,.36)); }
    .dodge-button { position: absolute; top: 50%; left: 50%; min-width: 180px; transform: translate(-50%, -50%); white-space: nowrap; transition: left .22s ease, top .22s ease; }
    .dodge-button:hover { transform: translate(-50%, -50%); }
    .dodge-button.is-ready { border-color: rgba(157,86,120,.55); background: linear-gradient(110deg, #e6a8b7, #f1c6d2); }
    .answer-form { display: grid; gap: 13px; }
    .choice-instruction { margin: 0; color: var(--muted); font: 1.08rem/1.5 Arial, sans-serif; }
    .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .choice-slot { min-width: 0; min-height: 52px; }
    .choice-button {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 12px 14px;
      border: 1px solid rgba(157,86,120,.4);
      border-radius: 13px;
      color: #5f3b53;
      background: #fff9fc;
      cursor: pointer;
      font: 600 1.08rem/1.35 Arial, sans-serif;
      text-align: left;
      transition: transform .32s cubic-bezier(.2,.8,.2,1), border-color .18s ease, background .18s ease;
    }

    .choice-button:hover { transform: translateY(-2px); border-color: var(--gold); background: rgba(213,139,167,.3); }
    .choice-button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    .choice-button:active { transform: scale(.98); }
    .choice-grid.is-shuffling .choice-button:disabled { cursor: wait; }
    .choice-grid.is-locked .choice-button:not(.is-target) { opacity: .58; }
    .choice-marker { display: grid; width: 20px; height: 20px; flex: 0 0 20px; place-items: center; border: 2px solid rgba(114,65,91,.58); border-radius: 50%; }
    .choice-button.is-target { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(167,85,120,.18); }
    .choice-button.is-target .choice-marker { border: 0; background: transparent; box-shadow: none; font-size: 1.15rem; animation: runaway-laugh .4s ease-in-out infinite alternate; }
    .choice-button.is-target .choice-marker::before { content: "😄"; }
    .choice-label { flex: 1; }
    .choice-button.is-correct { border-color: var(--gold); color: #fff8fb; background: linear-gradient(110deg, #a75578, #c97696); box-shadow: 0 8px 22px rgba(140,62,97,.2); animation: answer-flight .7s cubic-bezier(.2,.8,.2,1) both; }
    .choice-button.is-correct .choice-marker { border: 0; }
    .choice-button.is-correct .choice-marker::before { content: "💖"; font-size: 1.15rem; }
    .choice-button:disabled { cursor: default; }
    .correct-answer-slot { display: flex; min-height: 58px; justify-content: center; margin: 12px auto 0; }
    .advance-note { display: block; margin-top: 8px; color: var(--muted); font-size: .84rem; }

    .answer-input {
      width: 100%;
      min-height: 55px;
      padding: 14px 17px;
      border: 1px solid rgba(114,65,91,.26);
      border-radius: 13px;
      outline: none;
      color: var(--ink);
      background: #fffafd;
      font: 1rem Arial, sans-serif;
      transition: border-color .2s, box-shadow .2s;
    }

    .answer-input::placeholder { color: #8d7183; }
    .answer-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(167,85,120,.16); }

    .button {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 22px;
      border: 1px solid transparent;
      border-radius: 999px;
      color: #573549;
      background: linear-gradient(110deg, #d58ba7, #e6a8b7);
      box-shadow: 0 8px 26px rgba(140, 62, 97, .24);
      cursor: pointer;
      font: 700 1.02rem Arial, sans-serif;
      transition: transform .2s, filter .2s, opacity .2s;
    }

    .button:hover { filter: brightness(1.06); transform: translateY(-2px); }
    .button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    .button:disabled { cursor: not-allowed; opacity: .48; transform: none; }
    .button.secondary { border-color: rgba(157,86,120,.55); color: #874461; background: rgba(232,207,220,.52); box-shadow: none; }
    .button-row { display: flex; justify-content: center; gap: 11px; margin-top: 23px; }
    .answer-form .button { width: 100%; }

    .hint, .feedback, .success-message { min-height: 24px; margin: 0; font: 1.02rem/1.55 Arial, sans-serif; }
    .hint { margin-top: 13px; color: var(--gold); }
    .hint-button { width: 100%; min-height: 44px; margin-top: 3px; }
    .hint[hidden], .feedback[hidden], .success-message[hidden] { display: none; }
    .feedback { color: #a84562; }
    .success-message { margin-top: 22px; color: #a45472; text-align: center; }
    .success-message strong { font-weight: 500; }
    .timer { color: var(--gold); font-variant-numeric: tabular-nums; }
    .timer[hidden] { display: none; }

    .gift-scene { position: relative; width: 100%; height: 320px; margin: 8px auto 10px; }
    .gift-note {
      position: absolute;
      z-index: 3;
      bottom: 82px;
      left: 50%;
      width: min(92%, 560px);
      padding: 21px clamp(16px, 4vw, 34px);
      border: 1px solid rgba(157,86,120,.48);
      border-radius: 18px;
      opacity: 0;
      background: linear-gradient(145deg, rgba(247,223,234,.98), rgba(235,206,222,.98));
      box-shadow: 0 14px 42px rgba(69,35,57,.24), inset 0 1px rgba(255,255,255,.78);
      transform: translate(-50%, 76px) scale(.94);
      animation: surprise-letter 1.15s cubic-bezier(.16,1,.3,1) .75s forwards;
    }

    .gift-note h2 { margin: 0 0 10px; color: #653e54; font-size: clamp(1.8rem, 4vw, 2.45rem); line-height: 1.08; }
    .gift-note .final-copy { margin: 0 auto; font-size: .95rem; line-height: 1.6; }
    .gift-box { position: absolute; z-index: 2; bottom: 0; left: 50%; width: 160px; height: 116px; transform: translateX(-50%); }
    .gift-body {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 90px;
      overflow: hidden;
      border: 1px solid rgba(235,189,204,.96);
      border-radius: 7px 7px 13px 13px;
      background: linear-gradient(135deg, #c96e91, #9f4f73);
      box-shadow: 0 12px 28px rgba(69,35,57,.24);
    }

    .gift-body::before, .gift-lid::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(50% - 8px);
      width: 16px;
      background: linear-gradient(90deg, #d19b75, #f7dfb0, #c48b68);
      content: "";
    }

    .gift-lid {
      position: absolute;
      z-index: 3;
      bottom: 90px;
      left: -9px;
      width: 178px;
      height: 31px;
      border: 1px solid rgba(255,230,202,.95);
      border-radius: 7px;
      background: linear-gradient(105deg, #df9ab0, #ba6a8b);
      box-shadow: 0 4px 12px rgba(69,35,57,.23);
      transform-origin: 12% 100%;
      animation: open-gift 1s cubic-bezier(.2,.8,.2,1) .3s forwards;
    }

    .gift-lid::before { left: calc(50% - 8px); }
    .gift-bow { position: absolute; top: -13px; left: 50%; width: 42px; height: 17px; transform: translateX(-50%); }
    .gift-bow::before, .gift-bow::after {
      position: absolute;
      top: 1px;
      width: 17px;
      height: 11px;
      border: 2px solid #f8dfb4;
      border-radius: 12px 12px 3px 12px;
      content: "";
    }

    .gift-bow::before { left: 3px; transform: rotate(25deg); }
    .gift-bow::after { right: 3px; transform: rotate(65deg) scaleX(-1); }

    .gallery-button { margin: 2px auto 0; animation: arrive .45s ease both; }
    .photo-gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 25px; text-align: left; }
    .photo-gallery[hidden] { display: none; }
    .gallery-photo { min-width: 0; margin: 0; overflow: hidden; border: 1px solid rgba(157,86,120,.35); border-radius: 15px; background: #fffafd; box-shadow: 0 8px 22px rgba(69,35,57,.12); }
    .gallery-photo img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
    .gallery-photo figcaption { padding: 10px 12px 12px; color: #69445b; font: .78rem/1.4 Arial, sans-serif; text-align: center; }
    .memory-photo img,
    .gallery-photo img { cursor: zoom-in; }

    .image-viewer {
      width: 100%;
      max-width: none;
      height: 100%;
      max-height: none;
      margin: 0;
      padding: 28px;
      border: 0;
      background: rgba(20, 12, 18, .92);
      overflow: hidden;
    }

    .image-viewer[open] {
      display: grid;
      place-items: center;
    }

    .image-viewer::backdrop { background: rgba(20, 12, 18, .92); }

    .image-viewer img {
      width: auto;
      height: auto;
      max-width: calc(100vw - 56px);
      max-height: calc(100vh - 56px);
      border: 5px solid rgba(255, 246, 250, .94);
      border-radius: 16px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, .45);
      object-fit: contain;
    }

    .image-viewer-close {
      position: fixed;
      z-index: 2;
      top: 16px;
      right: 16px;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255, 255, 255, .65);
      border-radius: 50%;
      color: #fff;
      background: rgba(40, 24, 35, .82);
      cursor: pointer;
      font: 700 1.35rem Arial, sans-serif;
    }

    .image-viewer-close:hover { background: #7d3d60; }
    .image-viewer-close:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    @keyframes float-photo-left {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-15px) rotate(4deg); }
    }

    @keyframes float-photo-right {
      0%, 100% { transform: translateY(0) rotate(5deg); }
      50% { transform: translateY(-17px) rotate(-4deg); }
    }

    .fireworks {
      position: fixed;
      z-index: 20;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .88;
      pointer-events: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes open-gift {
      to { transform: translate(-12px, -18px) rotate(-25deg); }
    }

    @keyframes surprise-letter {
      to { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }

    @keyframes answer-flight {
      0% { opacity: .4; transform: translateY(-34px) scale(.9); }
      68% { opacity: 1; transform: translateY(5px) scale(1.04); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes runaway-laugh {
      from { transform: rotate(-12deg) translateY(1px); }
      to { transform: rotate(12deg) translateY(-2px); }
    }

    @keyframes heart-beat {
      to { transform: scale(1.2); }
    }

    @keyframes heart-pulse {
      0%, 100% { transform: rotate(var(--heart-rotation, 0deg)) scale(.92); opacity: .72; }
      50% { transform: rotate(var(--heart-rotation, 0deg)) scale(1.16); opacity: 1; }
    }

    @keyframes fill-progress {
      from { width: 0; }
      to { width: var(--progress-width, 0); }
    }

    @media (max-width: 1000px) {
      .floating-photos { display: none; }
      .shell { width: min(100%, 760px); }
      .memory-layout { grid-template-columns: minmax(0, .9fr) minmax(220px, 1.1fr); }
    }

    @media (max-width: 650px) {
      .page {
        min-height: 100svh;
        align-items: start;
        padding: max(12px, env(safe-area-inset-top)) 10px max(12px, env(safe-area-inset-bottom));
      }
      .shell { width: 100%; }

    function shuffle(items) {
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      return items;
    }

    function positionFloatingPhotos() {
      if (window.innerWidth <= 1000) return;

      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;
      const shellWidth = document.querySelector(".shell").getBoundingClientRect().width;
      const photoWidth = viewportWidth >= 3840
        ? 240
        : viewportWidth >= 2560
          ? Math.min(220, Math.max(210, viewportWidth * .07))
          : viewportWidth >= 1920
            ? Math.min(210, Math.max(180, viewportWidth * .08))
            : viewportWidth >= 1366
              ? Math.min(180, Math.max(145, viewportWidth * .09))
              : Math.min(180, Math.max(112, viewportWidth * .12));
      const photoHeight = photoWidth * 1.25;
      const shellLeft = (viewportWidth - shellWidth) / 2;
      const shellRight = shellLeft + shellWidth;
      const leftMax = Math.max(8, shellLeft - photoWidth + 26);
      const rightMin = Math.max(8, shellRight - 26);
      const rightMax = Math.max(rightMin, viewportWidth - photoWidth - 8);
      const monochromePhotos = shuffle(floatingPhotos.filter(photo => photo.dataset.tone === "monochrome"));
      const colorPhotos = shuffle(floatingPhotos.filter(photo => photo.dataset.tone === "color"));
      const verticalSlots = shuffle([.08, .4, .72]);
      const monochromeSides = shuffle(["left", "left", "right"]);
      const maxTop = Math.max(8, viewportHeight - photoHeight - 8);

      for (let index = 0; index < Math.min(monochromePhotos.length, colorPhotos.length); index += 1) {
        const top = Math.min(
          maxTop,
          Math.max(8, viewportHeight * verticalSlots[index] + (Math.random() - .5) * viewportHeight * .07)
        );
        const monochromeSide = monochromeSides[index];
        const leftPhoto = monochromeSide === "left" ? monochromePhotos[index] : colorPhotos[index];
        const rightPhoto = monochromeSide === "right" ? monochromePhotos[index] : colorPhotos[index];
        const left = 8 + Math.random() * (leftMax - 8);
        const right = rightMin + Math.random() * (rightMax - rightMin);

        leftPhoto.style.left = `${left}px`;
        leftPhoto.style.top = `${top}px`;
        rightPhoto.style.left = `${right}px`;
        rightPhoto.style.top = `${top}px`;
      }
    }

    function positionHeartDecorations() {
      if (!heartDecorations) return;

      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;
      const shellRect = document.querySelector(".shell").getBoundingClientRect();
      const blockedRects = floatingPhotos
        .filter(photo => getComputedStyle(photo).display !== "none")
        .map(photo => photo.getBoundingClientRect());
      const heartCount =
        viewportWidth < 650 ? 10 :
        viewportWidth < 1366 ? 24 :
        38;
      const hearts = [];

      heartDecorations.replaceChildren();

      for (let index = 0; index < heartCount; index += 1) {
        const size = 28 + Math.floor(Math.random() * 20);
        let left = 0;
        let top = 0;

        const candidates = [];
        for (let y = 24; y <= viewportHeight - size - 24; y += 58) {
          for (let x = 24; x <= viewportWidth - size - 24; x += 58) {
            candidates.push({
              left: x + Math.floor(Math.random() * 18 - 9),
              top: y + Math.floor(Math.random() * 18 - 9)
            });
          }
        }
        shuffle(candidates);

        for (const candidate of candidates) {
          const candidateLeft = Math.max(18, Math.min(viewportWidth - size - 18, candidate.left));
          const candidateTop = Math.max(18, Math.min(viewportHeight - size - 18, candidate.top));
          const heartRect = {
            left: candidateLeft - 16,
            right: candidateLeft + size + 16,
            top: candidateTop - 16,
            bottom: candidateTop + size + 16
          };
          const overlapsShell =
            heartRect.right > shellRect.left - 18 &&
            heartRect.left < shellRect.right + 18 &&
            heartRect.bottom > shellRect.top - 18 &&
            heartRect.top < shellRect.bottom + 18;
          const overlapsPhoto = blockedRects.some(rect =>
            heartRect.right > rect.left - 20 &&
            heartRect.left < rect.right + 20 &&
            heartRect.bottom > rect.top - 20 &&
            heartRect.top < rect.bottom + 20
          );
          const overlapsHeart = hearts.some(rect =>
            heartRect.right > rect.left &&
            heartRect.left < rect.right &&
            heartRect.bottom > rect.top &&
            heartRect.top < rect.bottom
          );

          if (!overlapsShell && !overlapsPhoto && !overlapsHeart) {
            left = candidateLeft;
            top = candidateTop;
            break;
          }
        }

        if (left === 0 && top === 0) continue;

        const heart = document.createElement("span");
        heart.className = "heart-decoration";
        heart.textContent = "♡";
        heart.style.left = `${left}px`;
        heart.style.top = `${top}px`;
        heart.style.fontSize = `${size}px`;
        heart.style.setProperty("--heart-rotation", `${-18 + Math.random() * 36}deg`);
        heart.style.setProperty("--pulse-speed", `${2.1 + Math.random() * 1.8}s`);
        heart.style.setProperty("--pulse-delay", `${-Math.random() * 3}s`);
        heartDecorations.appendChild(heart);
        hearts.push({ left: left - 10, right: left + size + 10, top: top - 10, bottom: top + size + 10 });
      }
    }

    function showStep(index) {

    function renderStep(index, stepList, isQuiz) {
      clearTimers();
      currentStage = isQuiz ? "quiz" : "quest";
      currentStep = index;
      const step = stepList[index];
      shuffleMovesLeft = isQuiz ? 0 : (step.shuffleCount || 0);
      correctAnswerLocked = false;
      lockedChoiceIndex = null;
      otherChoiceAttempts = 0;
      const isMemory = !isQuiz && Boolean(step.image);
      const progressWidth = stepList.length <= 1
        ? "76%"
        : `${(index / (stepList.length - 1)) * 76}%`;
      const content = `
        ${isQuiz ? '<h1 class="quiz-title">Жеңгеге арналған викторина</h1>' : ""}

          <div class="progress-heading">
            <span class="progress-kind">${isQuiz ? "Викторина" : `${index + 1}-ші блок`}</span>
            <div class="heart-progress" style="--heart-count:${stepList.length}; --progress-width:${progressWidth}" role="img" aria-label="${index + 1} / ${stepList.length} ${isQuiz ? "сұрақ" : "блок"} орындалды">${stepList.map((_, heartIndex) => `<span class="progress-heart${heartIndex <= index ? " is-filled" : ""}${heartIndex === index ? " is-current" : ""}" aria-hidden="true">${heartIndex <= index ? "♥" : "♡"}</span>`).join("")}</div>
          </div>

        ${isMemory ? `

              <figcaption class="photo-caption">${step.caption}</figcaption>
            </figure>
            <div class="memory-content">${stepContent(step, index, isQuiz)}</div>
          </div>` : stepContent(step, index, isQuiz)}`;
      app.innerHTML = content;
      const answerForm = document.querySelector("#answerForm");
      const firstChoice = answerForm.querySelector(".choice-button");
      if (firstChoice) firstChoice.focus({ preventScroll: true });
      answerForm.querySelectorAll(".choice-button").forEach((button) => {
        button.addEventListener("click", () => checkChoice(step, Number(button.dataset.choice), button));
      });
      const hintButton = document.querySelector("#hintButton");
      if (hintButton) hintButton.addEventListener("click", () => requestHint(step.hint));
      if (step.hint) {
        if (isQuiz) showHint(step.hint);
        else startHintTimer(step.hint);

    function stepContent(step, index, isQuiz) {
      const answerControl = step.options
        ? `<p class="choice-instruction">${isQuiz ? "Тест нұсқаларының бірін таңдаңыз:" : "Тест нұсқаларының бірін таңдаңыз:"}</p>
           <div class="choice-grid">${step.options.map((option, optionIndex) => `<div class="choice-slot"><button class="choice-button" type="button" data-choice="${optionIndex}"><span class="choice-marker" aria-hidden="true"></span><span class="choice-label">${option}</span></button></div>`).join("")}</div>`
        : "";
      const hintButton = step.hint && !isQuiz
        ? `<button class="button secondary hint-button" id="hintButton" type="button">Подсказка алу 💡</button>`
        : "";
      return `
        <h2>${step.title}</h2>
        ${step.question ? `<p class="question">${step.question}</p>` : ""}
        <form class="answer-form" id="answerForm">
          ${answerControl}
          ${hintButton}
          <p class="feedback" id="feedback" role="status" hidden></p>
          <p class="hint" id="hint" role="status" hidden></p>

    function isCorrectChoice(step, choiceIndex) {
      return Array.isArray(step.correctOptions)
        ? step.correctOptions.includes(choiceIndex)
        : choiceIndex === step.correctOption;
    }

    function checkChoice(step, choiceIndex, selectedButton) {
      if (correctAnswerLocked && choiceIndex !== lockedChoiceIndex) {
        const feedback = document.querySelector("#feedback");
        const jokeIndex = Math.min(otherChoiceAttempts, otherChoiceJokes.length - 1);
        feedback.textContent = otherChoiceJokes[jokeIndex];
        feedback.hidden = false;
        otherChoiceAttempts += 1;
        return;
      }

      if (!isCorrectChoice(step, choiceIndex)) {
        const feedback = document.querySelector("#feedback");
        feedback.textContent = currentStage === "quiz"
          ? "Қате жауап! Бұл нұсқа алынып тасталды. Қалғандарын байқап көріңіз."
          : "Қате жауап! Бұл нұсқа алынып тасталды. Қалғандарын байқап көріңіз 🙂";
        feedback.hidden = false;
        selectedButton.parentElement.replaceChildren();
        return;
      }

      correctAnswerLocked = true;
      lockedChoiceIndex = choiceIndex;
      if (shuffleMovesLeft > 0) {
        moveCorrectAnswer(selectedButton);
        return;
      }

      acceptAnswer(step, selectedButton);
    }

    function moveCorrectAnswer(selectedButton) {
      const grid = document.querySelector(".choice-grid");
      const feedback = document.querySelector("#feedback");
      grid.classList.add("is-locked");
      grid.classList.add("is-shuffling");
      selectedButton.classList.add("is-target");
      selectedButton.disabled = true;
      shuffleMovesLeft -= 1;
      feedback.textContent = shuffleMovesLeft > 0
        ? `Дұрыс! 😄 Тағы ${shuffleMovesLeft} рет қашады — ұстап көріңіз!`
        : "Соңғы рет қашты 😆 Енді дұрыс жауапты қайта басып, блокты ашыңыз!";
      feedback.hidden = false;
      swapChoicePositions(grid, selectedButton);
      shuffleTimer = window.setTimeout(() => {
        grid.classList.remove("is-shuffling");
        selectedButton.disabled = false;
        selectedButton.focus({ preventScroll: true });
        shuffleTimer = null;
      }, 400);
    }

    function swapChoicePositions(grid, selectedButton) {
      const slots = Array.from(grid.querySelectorAll(".choice-slot"));
      const sourceSlot = selectedButton.parentElement;
      const occupiedSlots = slots.filter((slot) => slot !== sourceSlot && slot.querySelector(".choice-button"));
      const availableSlots = occupiedSlots.length
        ? occupiedSlots
        : slots.filter((slot) => slot !== sourceSlot);
      if (availableSlots.length === 0) return;

      const targetSlot = availableSlots[Math.floor(Math.random() * availableSlots.length)];
      const otherButton = targetSlot.querySelector(".choice-button");
      const movingButtons = otherButton ? [selectedButton, otherButton] : [selectedButton];
      const startPositions = new Map(movingButtons.map((button) => [button, button.getBoundingClientRect()]));

      if (otherButton) sourceSlot.appendChild(otherButton);
      targetSlot.appendChild(selectedButton);

      movingButtons.forEach((button) => {
        const start = startPositions.get(button);
        const end = button.getBoundingClientRect();
        button.style.transition = "none";
        button.style.transform = `translate(${start.left - end.left}px, ${start.top - end.top}px)`;
        button.getBoundingClientRect();
        window.requestAnimationFrame(() => {
          button.style.transition = "";
          button.style.transform = "";
        });
      });
    }

    function acceptAnswer(step, selectedButton) {
      clearTimers();
      celebrateCorrectAnswer(selectedButton);
      const answerForm = document.querySelector("#answerForm");
      const correctAnswerSlot = document.querySelector("#correctAnswerSlot");
      if (selectedButton) {
        answerForm.querySelector(".choice-grid").hidden = true;
        selectedButton.disabled = true;
        selectedButton.classList.remove("is-target");
        selectedButton.classList.add("is-correct");
        correctAnswerSlot.hidden = false;
        correctAnswerSlot.appendChild(selectedButton);
        const instruction = answerForm.querySelector(".choice-instruction");
        if (instruction) instruction.hidden = true;
        const hintButton = document.querySelector("#hintButton");
        if (hintButton) hintButton.hidden = true;
        const feedback = document.querySelector("#feedback");
        feedback.hidden = true;
        document.querySelector("#hint").hidden = true;
        document.querySelector("#timer").hidden = true;
      }
      const photo = document.querySelector(".memory-photo");
      if (photo) photo.classList.add("is-revealed");
      const message = document.querySelector("#successMessage");
      const nextItemLabel = currentStage === "quiz"
        ? (currentStep === quizSteps.length - 1 ? "ойын" : "сұрақ")
        : "блок";
      const pauseText = step.image
        ? "Суретті тамашалаңыз! 🥰 Келесі блок 5 секундтан кейін ашылады."
        : `Келесі ${nextItemLabel} 5 секундтан кейін ашылады ✨`;
      message.innerHTML = `<strong>${step.success || "Дұрыс жауап! 🎉"}</strong><span class="advance-note">${pauseText}</span>`;
      message.hidden = false;
      let seconds = 5;
      const advanceNote = message.querySelector(".advance-note");
      advanceCountdownTimer = window.setInterval(() => {
        seconds -= 1;
        if (seconds <= 0) {
          window.clearInterval(advanceCountdownTimer);
          advanceCountdownTimer = null;
          advanceNote.textContent = step.image
            ? "Суретті тамашалаңыз! 🥰 Келесі блок ашылуда..."
            : `Келесі ${nextItemLabel} ашылуда ✨`;
        } else {
          advanceNote.textContent = step.image
            ? `Суретті тамашалаңыз! 🥰 Келесі блок ${seconds} секундтан кейін ашылады.`
            : `Келесі ${nextItemLabel} ${seconds} секундтан кейін ашылады ✨`;
        }
      }, 1000);
      advanceTimer = window.setTimeout(() => {
        advanceTimer = null;
        if (currentStage === "quiz") {
          if (currentStep === quizSteps.length - 1) showDodgeGame();
          else showQuizStep(currentStep + 1);
        } else if (currentStep === steps.length - 1) {
          showQuizStep(0);
        } else {
          showStep(currentStep + 1);
        }
      }, 5000);
    }

    function startHintTimer(hintText) {
      let seconds = 15;
      const timer = document.querySelector("#timer");
      timer.hidden = false;
      timer.textContent = `Подсказка ашылады: ${seconds} сек.`;
      countdownTimer = window.setInterval(() => {
        seconds -= 1;
        if (seconds <= 0) {
          window.clearInterval(countdownTimer);
          countdownTimer = null;
          timer.hidden = true;
          showHint(hintText);
        } else {
          timer.textContent = `Подсказка ашылады: ${seconds} сек.`;
        }
      }, 1000);
    }

    function requestHint(hintText) {
      const button = document.querySelector("#hintButton");
      const hint = document.querySelector("#hint");
      const timer = document.querySelector("#timer");
      if (!button || !hint || !hint.hidden || button.disabled) return;

      if (countdownTimer !== null) window.clearInterval(countdownTimer);
      countdownTimer = null;
      button.disabled = true;
      let seconds = 3;
      timer.hidden = false;
      timer.textContent = `Ойланып көріңіз: подсказка ${seconds} секундтан кейін ашылады.`;
      hintDelayTimer = window.setInterval(() => {
        seconds -= 1;
        if (seconds <= 0) {
          window.clearInterval(hintDelayTimer);
          hintDelayTimer = null;
          timer.hidden = true;
          showHint(hintText);
        } else {
          timer.textContent = `Ойланып көріңіз: подсказка ${seconds} секундтан кейін ашылады.`;
        }
      }, 1000);
    }

    function showHint(text) {
      const hint = document.querySelector("#hint");
      if (!hint) return;
      hint.textContent = `Подсказка: ${text}`;
      hint.hidden = false;
      const button = document.querySelector("#hintButton");
      if (button) button.hidden = true;
      const timer = document.querySelector("#timer");
      if (timer) timer.hidden = true;
    }

    function clearTimers() {
      if (countdownTimer !== null) window.clearInterval(countdownTimer);
      if (hintDelayTimer !== null) window.clearInterval(hintDelayTimer);
      if (advanceCountdownTimer !== null) window.clearInterval(advanceCountdownTimer);
      if (advanceTimer !== null) window.clearTimeout(advanceTimer);
      if (galleryRevealTimer !== null) window.clearTimeout(galleryRevealTimer);
      if (shuffleTimer !== null) window.clearTimeout(shuffleTimer);
      if (dodgeMessageTimer !== null) window.clearTimeout(dodgeMessageTimer);
      countdownTimer = null;
      hintDelayTimer = null;
      advanceCountdownTimer = null;
      advanceTimer = null;
      galleryRevealTimer = null;
      shuffleTimer = null;
      dodgeMessageTimer = null;
      shuffleMovesLeft = 0;
      correctAnswerLocked = false;
      lockedChoiceIndex = null;
      otherChoiceAttempts = 0;
    }

     dodgeLimit = 30 + Math.floor(Math.random() * 6);

      ];
      const surrenderMessage = "Жарайды, берілдім!";

      app.innerHTML = `
        <div class="mini-game">
          <p class="eyebrow">Бонус ойын 🎁</p>
          <h1 class="quiz-title">Қашатын курсор 🎁</h1>
          <p class="mini-game-copy">«Сыйлықты ашу» батырмасын ұстап көріңіз. Курсор жақындаған сайын ол қашады!</p>
          <div class="dodge-arena" id="dodgeArena">
            <button class="button dodge-button" id="dodgeButton" type="button">Сыйлықты ашу 🎁</button>

          </div>

      const arena = document.querySelector("#dodgeArena");

      function showDodgeFeedback(text, event) {
        feedback.textContent = text;
        feedback.hidden = false;
        if (event && (event.pointerType || event.clientX !== 0 || event.clientY !== 0)) {
          lastPointer = { x: event.clientX, y: event.clientY };
        }

        const arenaBounds = arena.getBoundingClientRect();
        const buttonBounds = targetButtonBounds || button.getBoundingClientRect();
        const cursor = lastPointer || {
          x: buttonBounds.left + (buttonBounds.right - buttonBounds.left) / 2,
          y: buttonBounds.top + (buttonBounds.bottom - buttonBounds.top) / 2
        };
        const cursorIsTop = cursor.y < arenaBounds.top + arenaBounds.height / 2;
        const cursorIsLeft = cursor.x < arenaBounds.left + arenaBounds.width / 2;
        const firstVertical = cursorIsTop ? "bottom" : "top";
        const firstHorizontal = cursorIsLeft ? "right" : "left";
        const otherVertical = firstVertical === "top" ? "bottom" : "top";
        const otherHorizontal = firstHorizontal === "left" ? "right" : "left";
        const candidates = [
          { vertical: firstVertical, horizontal: firstHorizontal },
          { vertical: firstVertical, horizontal: otherHorizontal },

        ];

        for (const candidate of candidates) {
          feedback.style.top = candidate.vertical === "top" ? "12px" : "auto";
          feedback.style.bottom = candidate.vertical === "bottom" ? "12px" : "auto";
          feedback.style.left = candidate.horizontal === "left" ? "12px" : "auto";
          feedback.style.right = candidate.horizontal === "right" ? "12px" : "auto";
          const feedbackBounds = feedback.getBoundingClientRect();
          const overlapsButton = feedbackBounds.left < buttonBounds.right
            && feedbackBounds.right > buttonBounds.left
            && feedbackBounds.top < buttonBounds.bottom
            && feedbackBounds.bottom > buttonBounds.top;
          const coversCursor = cursor.x >= feedbackBounds.left - 8
            && cursor.x <= feedbackBounds.right + 8
            && cursor.y >= feedbackBounds.top - 8
            && cursor.y <= feedbackBounds.bottom + 8;
          if (!overlapsButton && !coversCursor) return;
        }
      }

      function escapeButton(event) {
        if (dodgeCount >= dodgeLimit) return;

        const gap = 12;
        const maxLeft = Math.max(gap, arena.clientWidth - button.offsetWidth - gap);
        const maxTop = Math.max(gap, arena.clientHeight - button.offsetHeight - gap);
        const corners = [
          { left: gap, top: gap },
          { left: maxLeft, top: gap },
          { left: gap, top: maxTop },
          { left: maxLeft, top: maxTop }
        ];
        const choices = corners
          .map((corner, index) => ({ ...corner, index }))
          .filter(corner => corner.index !== lastDodgeCorner);
        const nextCorner = choices[Math.floor(Math.random() * choices.length)];
        lastDodgeCorner = nextCorner.index;
        dodgeCount += 1;
        button.style.left = `${nextCorner.left}px`;
        button.style.top = `${nextCorner.top}px`;
        button.style.transform = "none";
        const arenaBounds = arena.getBoundingClientRect();
        targetButtonBounds = {
          left: arenaBounds.left + nextCorner.left,
          top: arenaBounds.top + nextCorner.top,
          right: arenaBounds.left + nextCorner.left + button.offsetWidth,
          bottom: arenaBounds.top + nextCorner.top + button.offsetHeight
        };

        if (dodgeCount < dodgeLimit) {
          showDodgeFeedback(escapeMessages[(dodgeCount - 1) % escapeMessages.length], event);
          return;
        }

        button.classList.add("is-ready");
        const revealGift = () => {
          if (currentStage !== "dodge-game") return;
          showDodgeFeedback(surrenderMessage, null);
          dodgeMessageTimer = window.setTimeout(() => {
            dodgeMessageTimer = null;
            if (currentStage === "dodge-game") showFinal();
          }, 1200);
        };
        revealGift();
      }

      button.addEventListener("pointerenter", event => {
        if (event.pointerType !== "mouse" || dodgeCount >= dodgeLimit) return;
        escapeButton(event);
      });
      arena.addEventListener("pointerdown", event => {
        if (event.pointerType === "touch" && button.contains(event.target) && dodgeCount < dodgeLimit) {
          event.preventDefault();
          escapeButton(event);
        }
      });
      button.addEventListener("click", event => {
        if (dodgeCount < dodgeLimit) {
          escapeButton(event);
          return;
        }
        showFinal();
      });
    }

    function showFinal() {
      clearTimers();
      currentStage = "final";
      currentStep = steps.length;
      app.innerHTML = `
        <div class="final">
          <p class="eyebrow">Біздің қымбат жанымызға 💝</p>
          <div class="gift-scene">
            <div class="gift-wrap">
              <div class="gift-note" role="status">
                <h2>Туған күніңізбен, 🎂<br>жеңеше! 💐</h2>
                <p class="final-copy">Туған күніңіз құтты болсын! Сізге зор денсаулық, таусылмас бақыт, шаңырағыңызға береке мен отбасылық жылулық, ал әр бастамаңызға мол сәттілік тілеймін. Әр күніңіз қуанышқа, жақсы жаңалықтарға және жарқын сәттерге толы болсын. Жақындарыңыз әрдайым жаныңыздан табылып, жүзіңізден шынайы күлкі кетпесін. Бүгінгі туған күніңіз сізге ерекше қуаныш, ұмытылмас әсер мен керемет көңіл-күй сыйласын! 🥰💖</p>
              </div>
              <div class="gift-box" aria-hidden="true">
                <div class="gift-body"></div>
                <div class="gift-lid"><span class="gift-bow"></span></div>
              </div>
            </div>
          </div>
          <button class="button gallery-button" id="galleryButton" type="button" aria-controls="photoGallery" aria-expanded="false" hidden>Үш естелікті көру 📸</button>
          <button class="button secondary" id="againButton" type="button">Квестті қайта бастау 🔄</button>
          <div class="photo-gallery" id="photoGallery" aria-label="Естелік суреттер" hidden>
            <figure class="gallery-photo">
              <img src="08.03.2019.jpg" alt="Отбасының гүл сыйлаған ерекше кездесудегі суреті">
              <figcaption>Бәріміз алғаш жақындасқан күн 💖</figcaption>
            </figure>
            <figure class="gallery-photo">
              <img src="22.05.2022.jpg" alt="Жұптың кешкі кездесу сәті">
              <figcaption>Ортақ тарихтың алғашқы тарауы 💍</figcaption>
            </figure>
            <figure class="gallery-photo">
              <img src="01.08.2022.jpg" alt="Той күніндегі жас жұбайлар мен жақындары">
              <figcaption>Бақытқа толы той күні 🎉</figcaption>
            </figure>
          </div>
        </div>`;
      document.querySelector("#againButton").addEventListener("click", () => {
        stopFireworks();
        renderWelcome();
      });
      const galleryButton = document.querySelector("#galleryButton");
      const photoGallery = document.querySelector("#photoGallery");
      galleryButton.addEventListener("click", () => {
        photoGallery.hidden = !photoGallery.hidden;
        const isOpen = !photoGallery.hidden;
        galleryButton.textContent = isOpen ? "Суреттерді жасыру 📸" : "Үш естелікті көру 📸";
        galleryButton.setAttribute("aria-expanded", String(isOpen));
        if (isOpen) photoGallery.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
      galleryRevealTimer = window.setTimeout(() => {
        galleryButton.hidden = false;
        galleryRevealTimer = null;
      }, 2100);
      startFireworks();
    }

    function resizeCanvas() {
      const ratio = Math.min(window.devicePixelRatio || 1, 1.25);
      canvas.width = Math.floor(window.innerWidth * ratio);
      canvas.height = Math.floor(window.innerHeight * ratio);
      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function burst(x, y, count = 68) {
      for (let i = 0; i < count; i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3.8;
        particles.push({
          x, y, previousX: x, previousY: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 90 + Math.random() * 30,
          radius: 1.2 + Math.random() * 1.5,
          color: fireworkColors[Math.floor(Math.random() * fireworkColors.length)]
        });
      }
    }

    function launchRocket() {
      const onLeft = Math.random() < .5;
      rockets.push({
        x: window.innerWidth * (onLeft ? .06 + Math.random() * .16 : .78 + Math.random() * .16),
        y: window.innerHeight + 8,
        vx: (Math.random() - .5) * 1.2,
        vy: -(6 + Math.random() * 2.5),
        targetY: window.innerHeight * (.12 + Math.random() * .46),
        color: fireworkColors[Math.floor(Math.random() * fireworkColors.length)],
        trail: []
      });
    }

    function animateFireworks() {
      if (performance.now() >= fireworksEndTime) {
        fireworksFrame = null;
        particles = [];
        rockets = [];
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        return;
      }

      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      if (rockets.length < 2 && Math.random() < .018) launchRocket();

      const activeRockets = [];
      rockets.forEach((rocket) => {
        rocket.trail.push({ x: rocket.x, y: rocket.y });
        if (rocket.trail.length > 12) rocket.trail.shift();
        rocket.x += rocket.vx;
        rocket.y += rocket.vy;
        rocket.vy += .035;

        if (rocket.y <= rocket.targetY || rocket.vy >= -1.4) {
          burst(rocket.x, rocket.y);
          return;
        }

        ctx.beginPath();
        rocket.trail.forEach((point, index) => {
          if (index === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        });
        ctx.strokeStyle = rocket.color;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(rocket.x, rocket.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = "#8b2f58";
        ctx.fill();
        activeRockets.push(rocket);
      });
      rockets = activeRockets;

      for (let index = particles.length - 1; index >= 0; index -= 1) {
        const particle = particles[index];
        if (particle.life <= 0) {
          particles.splice(index, 1);
          continue;
        }
        particle.previousX = particle.x;
        particle.previousY = particle.y;
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.vy += .045;
        particle.vx *= .986;
        particle.life -= 1;
        ctx.beginPath();
        ctx.moveTo(particle.previousX, particle.previousY);
        ctx.lineTo(particle.x, particle.y);
        ctx.globalAlpha = Math.min(1, particle.life / 28);
        ctx.strokeStyle = particle.color;
        ctx.lineWidth = particle.radius * 1.4;
        ctx.lineCap = "round";
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      fireworksFrame = window.requestAnimationFrame(animateFireworks);
    }

    function startFireworks() {
      resizeCanvas();
      particles = [];
      rockets = [];
      fireworksEndTime = performance.now() + 10000;
      burst(window.innerWidth * .08, window.innerHeight * .28);
      burst(window.innerWidth * .92, window.innerHeight * .28);
      launchRocket();
      launchRocket();
      animateFireworks();
    }

    function celebrateCorrectAnswer(selectedButton) {
      resizeCanvas();

      const rect = selectedButton
        ? selectedButton.getBoundingClientRect()
        : null;
      const x = rect
        ? rect.left + rect.width / 2
        : window.innerWidth / 2;
      const y = rect
        ? rect.top + rect.height / 2
        : window.innerHeight / 2;

      burst(x, y, window.innerWidth < 650 ? 18 : 26);

      if (fireworksFrame === null) {
        fireworksEndTime = performance.now() + 1800;
        animateFireworks();
      } else {
        fireworksEndTime = Math.max(fireworksEndTime, performance.now() + 1800);
      }
    }

    function stopFireworks() {
      if (fireworksFrame !== null) window.cancelAnimationFrame(fireworksFrame);
      fireworksFrame = null;
      particles = [];
      rockets = [];
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", () => {
      window.clearTimeout(floatingPhotoResizeTimer);
      floatingPhotoResizeTimer = window.setTimeout(() => {
        positionFloatingPhotos();
        positionHeartDecorations();
      }, 120);
      if (currentStep === steps.length) resizeCanvas();
    });

    positionFloatingPhotos();
    positionHeartDecorations();
    if (heartDecorationTimer !== null) window.clearInterval(heartDecorationTimer);
    heartDecorationTimer = window.setInterval(positionHeartDecorations, 3000);
    if (floatingPhotoTimer !== null) window.clearInterval(floatingPhotoTimer);
    floatingPhotoTimer = window.setInterval(() => {
      positionFloatingPhotos();
      window.setTimeout(positionHeartDecorations, 1450);
    }, 7500);
    backgroundMusic.volume = .35;
    backgroundMusic.addEventListener("play", updateMusicToggle);
    backgroundMusic.addEventListener("pause", updateMusicToggle);
    backgroundMusic.addEventListener("error", () => {
      musicStatus.textContent = "Фондық музыка файлы ашылмады.";
      updateMusicToggle();
    });
    musicToggle.addEventListener("click", async () => {
      if (backgroundMusic.paused) await playBackgroundMusic();
      else {
        backgroundMusic.pause();
        musicStatus.textContent = "Фондық музыка тоқтатылды.";
      }
      updateMusicToggle();
    });
    document.addEventListener("pointerdown", tryMusicOnFirstInteraction, { once: true });
    document.addEventListener("keydown", tryMusicOnFirstInteraction, { once: true });

    renderWelcome();
    void playBackgroundMusic();
  </script>
</body>
</html>
